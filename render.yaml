services:
  - type: web
    name: visioninspectai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visioninspectai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENABLE_ML_INSPECTION
        value: "false"
      - key: FRONTEND_URL
        sync: false

databases:
  - name: visioninspectai-db
    databaseName: visioninspectai
    user: visioninspectai
    plan: free
    region: oregon
