services:
  - type: web
    name: visioninspectai-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0 torchvision==0.29.0 && pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: visioninspectai-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: visioninspectai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENABLE_ML_INSPECTION
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: FRONTEND_URL
        sync: false
  - type: web
    name: visioninspectai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: visioninspectai-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: visioninspectai-db
    databaseName: visioninspectai
    user: visioninspectai
    plan: free
    region: oregon
